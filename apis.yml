aid: wiz-freight
name: Wiz Freight
description: >-
  Wiz Freight (Wiz Logtec Solutions Private Limited) was a Chennai, India based digital
  freight forwarder founded in 2020 by Ramkumar Ramachandran and Ramkumar Govindarajan,
  offering ocean, air and surface freight booking, instant rate discovery, live shipment
  tracking, digital documentation and multi-currency freight payments through its own
  technology platform. The company raised roughly $58.6M from Tiger Global Management,
  Nippon Express Holdings, SBI Investment, Stride Ventures, Foundamental and Axilor
  Ventures. Trade press reported in September 2025 that the company had suspended export
  bookings amid an executive exodus, and as of September 2026 its public surface is gone:
  wizfreight.com serves a GoDaddy Website Builder placeholder, the former booking portal
  path 404s, and the sit.wizfreight.net platform host no longer resolves. No developer
  program, API reference or machine-readable contract was ever published on a reachable
  host, and none survives today.
